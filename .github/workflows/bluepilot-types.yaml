name: BluePilot types

on:
  pull_request:
  push:
    branches: [bp-exp, bp-dev-models]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install mypy==2.3.1
      - run: python -m mypy --config-file mypy.ini
      - run: python tools/check_type_regressions.py
      - run: python tools/check_branch_types.py

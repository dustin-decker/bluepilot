[mypy]
python_version = 3.12
follow_imports = silent
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
exclude = /test_
files = bluepilot/learned_stops,
        tools/device.py,
        tools/check_type_regressions.py,
        selfdrive/ui/bp/lib/calibration_reset.py,
        selfdrive/ui/bp/lib/learned_stops.py,
        tools/autocal_analysis.py,
        tools/autocal_simulate.py,
        tools/autocal_validation.py,
        tools/check_branch_types.py,
        tools/ford_process_replay.py,
        tools/route_inventory.py,
        tools/learned_stops.py,
        tools/learned_stops_benchmark.py,
        tools/ui_screenshots.py,
        tools/lib/source_provenance.py,
        common/tests/test_params_stub.py,
        opendbc_repo/opendbc/sunnypilot/car/ford/angle_autocal.py,
        opendbc_repo/opendbc/sunnypilot/car/ford/angle_autocal_controller.py,
        opendbc_repo/opendbc/sunnypilot/car/ford/angle_smoothing.py,
        opendbc_repo/opendbc/sunnypilot/car/ford/lateral_angle_ext.py

# Follow inherited code for signatures without making its existing diagnostics
# our baseline. Native Params has a checked-in stub; never skip that import.
